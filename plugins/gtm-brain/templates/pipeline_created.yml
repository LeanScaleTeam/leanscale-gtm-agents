# One metric. One owner. One source of truth.
# Change this file by pull request only — never in a dashboard.
# Double-brace placeholders (including the extra-caveats line at the bottom)
# are filled by the draft step; copying by hand, replace or delete them yourself.

metric: pipeline_created
owner: "@FIXME"                 # one human. not a team. not "RevOps".
label: "Pipeline created"
description: >
  The {{BOOKINGS_AMOUNT_FIELD}} value of opportunities that entered
  {{QUALIFIED_STAGE}} in the period. Counted at qualification, not at
  record creation — pipeline is what sales accepted, not what marketing
  logged.

source_of_truth:
  system: "{{CRM_SYSTEM}}"      # salesforce | hubspot
  object: "{{OPP_OBJECT}}"
  fields: ["{{QUALIFIED_STAGE_DATE_FIELD}}", "{{BOOKINGS_AMOUNT_FIELD}}"]

entity: opportunity
grain: opportunity_id           # one row = one opportunity

filter: "{{QUALIFIED_STAGE_DATE_FIELD}} is not null{{EXCLUDED_FILTER}}"

measure: sum({{BOOKINGS_AMOUNT_FIELD}})

time:
  column: "{{QUALIFIED_STAGE_DATE_FIELD}}"   # counted when it qualified, not when it was created
  type: period

policy:
  row_access: segment

# caveats the definition has to carry with it
caveats:
  - "Amount as of today, not as of qualification. Restating 'pipeline as of' needs snapshots — a later phase."
{{EXTRA_CAVEATS}}
